name: Run py-micp

on:
 pull_request:
   
jobs:
  run-py-micp-local:
    permissions:
      contents: read
    timeout-minutes: 10        
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v5

      - name: Install OPM Flow and Octave
        run: |
          sudo apt-get update
          sudo apt-get install software-properties-common mpi-default-bin octave
          sudo apt-add-repository ppa:opm/ppa
          sudo apt-get update
          sudo apt-get install libopm-simulators-bin
          
      - name: Install python requirements
        run: |
          python3 -m venv vpy-micp
          . vpy-micp/bin/activate
          echo "$PWD/vpy-micp/bin" >> $GITHUB_PATH
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
          
      - name: Check code style and linting
        run: |
          black --target-version py314 ./ --check
          pylint ./ --ignore-paths="vpy-micp/","MRST","test_outputs"
          ruff check ./
      
      - name: Download MRST
        run: |
          git clone https://github.com/SINTEF-AppliedCompSci/MRST.git
          cd MRST
          git checkout 2026a
        
      - name: Run the tests
        run: |
          pytest --basetemp=test_outputs --mrst_startup "$GITHUB_WORKSPACE/MRST/startup.m" tests/ --exitfirst
